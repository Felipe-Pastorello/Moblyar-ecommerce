
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Administrativo - Moblyar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
        <h2 class="mb-2">Painel administrativo</h2>
        <p class="text-secondary mb-4">Entre com suas credenciais de administrador.</p>

        <div th:if="${param.erro}" class="alert alert-danger">
            Usuário ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Você saiu do painel administrativo.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" id="username" name="username"
                       class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" name="password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-dark w-100">
                Entrar no painel
            </button>
        </form>
    </div>
</main>
</body>
</html>
