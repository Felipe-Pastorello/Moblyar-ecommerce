<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Pedidos - Moblyar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/body.css}">
    <link rel="stylesheet" th:href="@{/css/GerenciarPedidos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body style="background-color: #F1F0F5">

<div class="container py-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="mb-1">Painel do Administrador</h2>
            <p class="text-secondary mb-0">Gerenciamento de pedidos</p>
        </div>

        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary">
                <i class="bi bi-box-arrow-right me-1"></i>
                Sair do painel
            </button>
        </form>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/admin/produtos}" class="btn btn-light border">
            <i class="bi bi-box-seam me-1"></i> Produtos
        </a>
        <a th:href="@{/admin/categorias}" class="btn btn-light border">
            <i class="bi bi-folder me-1"></i> Categorias
        </a>
        <a th:href="@{/admin/pedidos}" class="btn btn-red">
            <i class="bi bi-receipt me-1"></i> Pedidos
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-circle me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filtros -->
    <div class="card pedido-filtros mb-4">
        <div class="card-body p-3 p-lg-4">
            <h5 class="mb-3">
                <i class="bi bi-funnel me-2"></i>Buscar e filtrar pedidos
            </h5>

            <form th:action="@{/admin/pedidos}" method="get">
                <div class="row g-3">

                    <div class="col-12 col-lg-6">
                        <label for="busca" class="form-label">Busca</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control" id="busca" name="busca" placeholder="ID, nome ou e-mail do cliente" th:value="${busca}">
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="status" class="form-label">Status</label>
                        <select id="status" name="status" class="form-select">
                            <option value="">Todos os status</option>
                            <option th:each="s : ${statusDisponiveis}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${statusSelecionado == s.name()}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="dataInicio" class="form-label">Data inicial</label>
                        <input type="date" class="form-control" id="dataInicio" name="dataInicio" th:value="${dataInicio}">
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label for="dataFim" class="form-label">Data final</label>
                        <input type="date" class="form-control" id="dataFim" name="dataFim" th:value="${dataFim}">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="precoMin" class="form-label">Preço mínimo (R$)</label>
                        <input type="number" class="form-control" id="precoMin" name="precoMin" min="0" step="0.01" placeholder="0,00" th:value="${precoMin}">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="precoMax" class="form-label">Preço máximo (R$)</label>
                        <input type="number" class="form-control" id="precoMax" name="precoMax" min="0" step="0.01" placeholder="0,00" th:value="${precoMax}">
                    </div>

                    <div class="col-12 d-flex flex-wrap gap-2 align-items-end">
                        <button type="submit" class="btn btn-red">
                            <i class="bi bi-search me-1"></i> Aplicar filtros
                        </button>
                        <a th:href="@{/admin/pedidos}" class="btn btn-light border">
                            <i class="bi bi-x-circle me-1"></i> Limpar filtros
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- Resumo -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h5 class="mb-0">Pedidos encontrados</h5>
        <span class="badge text-bg-light border" th:text="${paginaPedidos.totalElements + ' pedido(s)'}"></span>
    </div>

    <!-- Tabela -->
    <div class="card pedido-tabela">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Status atual</th>
                    <th>Atualizar status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${paginaPedidos.content}">
                    <td>
                        <span class="fw-semibold" th:text="${'#' + p.id}"></span>
                    </td>

                    <td>
                        <div class="fw-semibold" th:text="${p.usuario.nome}"></div>
                        <small class="text-secondary" th:text="${p.usuario.email}"></small>
                    </td>

                    <td>
                        <span th:text="${#temporals.format(p.data, 'dd/MM/yyyy')}"></span>
                        <small class="d-block text-secondary" th:text="${#temporals.format(p.data, 'HH:mm')}"></small>
                    </td>

                    <td th:text="${p.items == null ? 0 : #lists.size(p.items)}"></td>

                    <td class="text-nowrap fw-semibold" th:text="${'R$ ' + #numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}">
                    </td>

                    <td>
                        <span class="badge pedido-status" th:classappend="${' status-' + #strings.toLowerCase(p.status.name())}" th:text="${p.status.name()}">
                        </span>
                    </td>

                    <td>
                        <form th:action="@{/admin/pedidos/{id}/status(id=${p.id})}" method="post" class="pedido-form-status">

                            <input type="hidden" name="busca" th:value="${busca}">
                            <input type="hidden" name="status" th:value="${statusSelecionado}">
                            <input type="hidden" name="dataInicio" th:value="${dataInicio}">
                            <input type="hidden" name="dataFim" th:value="${dataFim}">
                            <input type="hidden" name="precoMin" th:value="${precoMin}">
                            <input type="hidden" name="precoMax" th:value="${precoMax}">
                            <input type="hidden" name="pagina" th:value="${paginaPedidos.number}">

                            <select name="novoStatus" class="form-select form-select-sm" aria-label="Novo status do pedido" required>
                                <option th:each="s : ${statusDisponiveis}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${p.status == s}">
                                </option>
                            </select>

                            <button type="submit" class="btn btn-sm btn-outline-danger mt-2 w-100">
                                <i class="bi bi-check2 me-1"></i> Salvar
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${paginaPedidos.empty}">
                    <td colspan="7" class="text-center py-5">
                        <i class="bi bi-inbox fs-1 d-block text-secondary mb-2"></i>
                        <h5>Nenhum pedido encontrado</h5>
                        <p class="text-secondary mb-3">
                            Tente alterar os filtros da pesquisa.
                        </p>
                        <a th:href="@{/admin/pedidos}" class="btn btn-outline-secondary">
                            Limpar filtros
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginação -->
        <div th:if="${paginaPedidos.totalPages > 1}" class="pedido-paginacao d-flex flex-wrap justify-content-between align-items-center gap-3 p-3">
            <small class="text-secondary" th:text="${'Página ' + (paginaPedidos.number + 1) + ' de ' + paginaPedidos.totalPages}">
            </small>

            <nav aria-label="Paginação dos pedidos">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaPedidos.first} ? ' disabled'">
                        <a class="page-link" th:href="@{/admin/pedidos(pagina=${paginaPedidos.number - 1}, busca=${busca}, status=${statusSelecionado}, dataInicio=${dataInicio}, dataFim=${dataFim}, precoMin=${precoMin}, precoMax=${precoMax})}" aria-label="Página anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="n : ${#numbers.sequence(0, paginaPedidos.totalPages - 1)}" th:classappend="${n == paginaPedidos.number} ? ' active'">
                        <a class="page-link" th:href="@{/admin/pedidos(pagina=${n}, busca=${busca}, status=${statusSelecionado}, dataInicio=${dataInicio}, dataFim=${dataFim}, precoMin=${precoMin}, precoMax=${precoMax})}" th:text="${n + 1}">
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${paginaPedidos.last} ? ' disabled'">
                        <a class="page-link" th:href="@{/admin/pedidos(pagina=${paginaPedidos.number + 1}, busca=${busca}, status=${statusSelecionado}, dataInicio=${dataInicio}, dataFim=${dataFim}, precoMin=${precoMin}, precoMax=${precoMax})}" aria-label="Próxima página">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll(".pedido-form-status").forEach(form => {
        form.addEventListener("submit", event => {
            const select = form.querySelector('select[name="novoStatus"]');
            if (!select.value) {
                event.preventDefault();
                return;
            }

            if (!confirm("Deseja realmente atualizar o status deste pedido?")) {
                event.preventDefault();
            }
        });
    });

    const dataInicio = document.getElementById("dataInicio");
    const dataFim = document.getElementById("dataFim");

    dataInicio.addEventListener("change", () => {
        dataFim.min = dataInicio.value;
    });

    dataFim.addEventListener("change", () => {
        dataInicio.max = dataFim.value;
    });
</script>

</body>
</html>
