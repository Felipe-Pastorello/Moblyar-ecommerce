<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/body.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <div class="card mb-5 p-4" th:each="c : ${categorias}" th:classappend="${c.status == 'INATIVO'} ? ' categoria-inativa' : ''">
    <div class="d-flex justify-content-between">
        <div>
            <h5 th:text="${c.nome + ' - ' + c.status}"></h5>
            <small>
                ID:
                <span th:text="${c.id}">
                </span>
                •
                <span th:text="${#lists.size(c.produtos)}">
                </span>
                produtos
            </small>
        </div>
        <div>
            <button class="btn btn-warning btn-editar" data-bs-toggle="modal" data-bs-target="#categoriaModal" th:attr="data-id=${c.id}, data-nome=${c.nome}">
                Editar
            </button>
            <a th:href="@{/categorias/status/{id}(id=${c.id})}" class="btn" th:classappend="${c.status == 'ATIVO'} ? ' btn-danger' : ' btn-success'">
                <span th:text="${c.status == 'ATIVO' ? 'Inativar' : 'Ativar'}">
                </span>
            </a>
            <a th:href="@{/categorias/delete/{id}(id=${c.id})}" class="btn btn-danger">
                Excluir
            </a>
        </div>
    </div>
    <hr>
    <table class="table">
        <tr th:each="p:${c.produtos}">
            <td>
                <div th:if="${!#lists.isEmpty(p.imagens)}">

                    <img th:src="@{'/uploads/' + ${p.imagens[0].nomeArquivo}}"
                         width="100"
                         height="100"
                         style="object-fit:cover"
                         class="rounded">

                </div>
            </td>
            <td th:text="${p.nome}">
            </td>
            <td th:text="${p.preco}">
            </td>
            <td th:text="${p.estoque}">
            </td>
            <td>
                <a th:href="@{/produtos/removerCategoria(produtoId=${p.id}, categoriaId=${c.id})}" class="btn btn-danger btn-sm">
                    Remover
                </a>
            </td>
        </tr>
    </table>
</div>
</div>
<div class="modal fade" id="categoriaModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/categorias/save}" method="post">
                <div class="modal-header">
                    <h5>Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="categoriaId" name="id">
                    <label>Nome</label>
                    <input type="text" class="form-control" id="categoriaNome" name="nome">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.btn-editar')
        .forEach(btn=>{

            btn.addEventListener('click',function(){

                document.getElementById(
                    "categoriaId"
                ).value=this.dataset.id;

                document.getElementById(
                    "categoriaNome"
                ).value=this.dataset.nome;

            });

        });
</script>
</body>
</html>
