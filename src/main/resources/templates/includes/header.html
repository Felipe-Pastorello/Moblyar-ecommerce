<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                E-commerce
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSite">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSite">
                <!-- Pesquisa -->
                <form class="d-flex mx-auto" th:action="@{/buscar}" method="get">
                    <input class="form-control" type="search" name="nome" placeholder="Pesquisar produtos..." aria-label="Pesquisar">
                    <button class="btn btn-red ms-2" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <ul class="navbar-nav ms-auto">
                    <li>
                        <a th:href="@{/perfil}" class="btn btn-outline-dark">
                            <i class="bi bi-person"></i>
                            Perfil
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-light" type="button" data-bs-toggle="modal" data-bs-target="#carrinhoModal">
                            <i class="bi bi-cart"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
