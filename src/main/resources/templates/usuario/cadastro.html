<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Moblyar</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            th:href="@{/css/body.css}">

</head>

<body>

<div th:replace="~{includes/header :: header}"></div>


<section class="py-5"
         style="min-height: calc(100vh - 300px);">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-6 col-lg-4">

                <div class="card border rounded-4">

                    <div class="card-body p-4">

                        <h5 class="mb-1">
                            Criar conta
                        </h5>

                        <p class="text-secondary">
                            Cadastre-se para começar a comprar na Moblyar.
                        </p>


                        <!-- ERRO -->

                        <div
                                th:if="${erro}"
                                class="alert alert-danger"
                                th:text="${erro}">
                        </div>


                        <form
                                th:action="@{/cadastro}"
                                th:object="${usuario}"
                                method="post">


                            <div class="mb-3">

                                <label class="form-label">
                                    Nome completo
                                </label>

                                <input
                                        type="text"
                                        th:field="*{nome}"
                                        class="form-control"
                                        placeholder="John Doe"
                                        required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                        type="email"
                                        th:field="*{email}"
                                        class="form-control"
                                        placeholder="your@email.com"
                                        required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Senha
                                </label>

                                <input
                                        type="password"
                                        th:field="*{senha}"
                                        class="form-control"
                                        placeholder="••••••••"
                                        required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Confirmar senha
                                </label>

                                <input
                                        type="password"
                                        name="confirmarSenha"
                                        class="form-control"
                                        placeholder="••••••••"
                                        required>

                            </div>


                            <button
                                    type="submit"
                                    class="btn btn-red w-100">

                                Cadastre-se

                            </button>

                        </form>


                        <div class="text-center mt-3">

                            Já possui uma conta?

                            <a th:href="@{/login}"
                               class="text-red text-decoration-none">

                                Faça Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<div th:replace="~{includes/footer :: footer}"></div>

</body>

</html>
