<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço - Moblyar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">
    <link rel="stylesheet" th:href="@{/css/body.css}">
</head>

<body>
<div th:replace="~{includes/header :: header}"></div>

<main class="conta-main">
    <div class="container conta-container">
        <div class="conta-heading">
            <h1 th:text="${modoEdicao} ? 'Editar endereço' : 'Novo endereço'">
                Novo endereço
            </h1>
            <p>Preencha os dados do endereço.</p>
        </div>

        <div class="conta-card">
            <form th:object="${endereco}" th:action="${modoEdicao} ? @{/perfil/enderecos/{id}(id=${endereco.id})} : @{/perfil/enderecos}" method="post">

                <div class="mb-3">
                    <label for="rua" class="form-label">Rua e número</label>
                    <input type="text" id="rua" th:field="*{rua}" class="form-control" maxlength="255" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" id="cidade" th:field="*{cidade}" class="form-control" maxlength="100" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <input type="text" id="estado" th:field="*{estado}" class="form-control" maxlength="100" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" id="cep" th:field="*{cep}" class="form-control" maxlength="9" placeholder="00000-000" required>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-red">
                        <i class="bi bi-check-lg me-1"></i>
                        Salvar endereço
                    </button>

                    <a th:href="@{/perfil}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{includes/footer :: footer}"></div>
<div th:replace="~{includes/carrinho :: carrinho}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/carrinho.js}"></script>
</body>
</html>
