<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar produtos - Moblyar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <style>
        .text-red {
            color: #e00000;
        }

        .btn-red {
            background-color: #e00000;
            color: white;
            border: none;
        }

        .btn-red:hover {
            background-color: #c00000;
            color: white;
        }

        .produto-card {
            transition: transform .2s ease,
            box-shadow .2s ease;
        }

        .produto-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .produto-imagem {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .filtro-card {
            position: sticky;
            top: 20px;
        }

        @media (max-width: 991px) {

            .filtro-card {
                position: static;
            }

        }

    </style>
</head>

<body class="bg-light">
<div th:replace="~{includes/header :: header}"></div>
<main class="container py-5">
    <div class="mb-4">
        <h1 class="fw-bold">
            <span th:if="${nome == null or nome.isEmpty()}">
                Todos os produtos
            </span>
            <span th:unless="${nome == null or nome.isEmpty()}">
                Resultados para:
                "<span th:text="${nome}"></span>"
            </span>
        </h1>
        <p class="text-muted mb-0">
            <span th:text="${produtos.totalElements}">
                0
            </span>
            produto(s) encontrado(s)
        </p>
    </div>
    <div class="row g-4">
        <aside class="col-12 col-lg-3">
            <div class="card border-0 shadow-sm filtro-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="mb-0 fw-bold">
                            Filtros
                        </h5>
                        <a th:href="@{/buscar}" class="small text-decoration-none">
                            Limpar
                        </a>
                    </div>
                    <form th:action="@{/buscar}" method="get">
                        <input type="hidden" name="nome" th:value="${nome}">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Categoria
                            </label>
                            <select name="categoriaId" class="form-select">
                                <option value="">
                                    Todas as categorias
                                </option>
                                <option
                                        th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nome}"
                                        th:selected="${categoriaId != null and categoriaId == categoria.id}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Faixa de preço
                            </label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label small text-muted">
                                        Mínimo
                                    </label>
                                    <input type="number" name="precoMin" th:value="${precoMin}" class="form-control" min="0" step="0.01" placeholder="R$ 0">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small text-muted">
                                        Máximo
                                    </label>
                                    <input type="number" name="precoMax" th:value="${precoMax}" class="form-control" min="0" step="0.01" placeholder="R$ 9999">
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Ordenar por
                            </label>
                            <select name="ordenar" class="form-select">
                                <option value="relevancia" th:selected="${ordenar == 'relevancia'}">
                                    Mais relevantes
                                </option>
                                <option value="nome" th:selected="${ordenar == 'nome'}">
                                    Nome: A-Z
                                </option>
                                <option value="precoMenor" th:selected="${ordenar == 'precoMenor'}">
                                    Menor preço
                                </option>
                                <option value="precoMaior" th:selected="${ordenar == 'precoMaior'}">
                                    Maior preço
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-red w-100">
                            <i class="bi bi-funnel me-2"></i>
                            Aplicar filtros
                        </button>
                    </form>
                </div>
            </div>
        </aside>
        <section class="col-12 col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-muted">
                    Página
                    <strong th:text="${produtos.number + 1}">
                        1
                    </strong>
                    de
                    <strong th:text="${produtos.totalPages}">
                        1
                    </strong>
                </span>
            </div>
            <div th:if="${produtos.empty}" class="bg-white rounded-4 p-5 text-center">
                <i class="bi bi-search fs-1 text-muted"></i>
                <h3 class="mt-3">
                    Nenhum produto encontrado
                </h3>
                <p class="text-muted">
                    Tente utilizar outro termo ou modificar
                    os filtros da pesquisa.
                </p>
                <a th:href="@{/buscar}" class="btn btn-red">
                    Ver todos os produtos
                </a>
            </div>
            <div th:unless="${produtos.empty}" class="row g-4">
                <div class="col-12 col-sm-6 col-xl-4" th:each="produto : ${produtos}">
                    <div class="card border-0 rounded-4 overflow-hidden h-100 produto-card">
                        <div th:if="${!#lists.isEmpty(produto.imagens)}">
                            <img th:src="@{'/uploads/' + ${produto.imagens[0].nomeArquivo}}" th:alt="${produto.nome}" class="produto-imagem">
                        </div>
                        <div th:unless="${!#lists.isEmpty(produto.imagens)}" class="produto-imagem bg-secondary-subtle d-flex align-items-center justify-content-center">
                            <i class="bi bi-image fs-1 text-muted"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-semibold" th:text="${produto.nome}">
                                Produto
                            </h5>
                            <p class="text-muted small mb-2" th:text="${produto.descricao}">
                                Descrição do produto
                            </p>
                            <div class="mt-auto">
                                <p class="fs-5 fw-bold text-red mb-3">
                                    R$
                                    <span th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}">
                                        0,00
                                    </span>
                                </p>
                                <form th:action="@{/carrinho/adicionar}" method="post">
                                    <input type="hidden" name="produtoId" th:value="${produto.id}">
                                    <button type="submit" class="btn btn-red w-100">
                                        <i class="bi bi-cart-plus me-2"></i>
                                        Adicionar ao carrinho
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <nav th:if="${produtos.totalPages > 1}" class="mt-5" aria-label="Navegação dos produtos">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/buscar(nome=${nome}, categoriaId=${categoriaId}, precoMin=${precoMin}, precoMax=${precoMax}, ordenar=${ordenar}, pagina=${produtos.number - 1})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li th:each="pagina : ${#numbers.sequence(0, produtos.totalPages - 1)}" class="page-item" th:classappend="${pagina == produtos.number} ? 'active'">
                        <a class="page-link" th:href="@{/buscar(nome=${nome}, categoriaId=${categoriaId}, precoMin=${precoMin}, precoMax=${precoMax}, ordenar=${ordenar}, pagina=${pagina})}" th:text="${pagina + 1}">
                            1
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/buscar(nome=${nome}, categoriaId=${categoriaId}, precoMin=${precoMin}, precoMax=${precoMax}, ordenar=${ordenar}, pagina=${produtos.number + 1})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
    </div>
</main>
<div th:replace="~{includes/footer :: footer}"></div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
