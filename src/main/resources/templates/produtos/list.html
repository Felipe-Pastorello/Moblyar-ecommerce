<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">

    <h2 class="mb-4">Produtos</h2>

    <button class="btn btn-primary mb-4" data-bs-toggle="modal" data-bs-target="#productModal" onclick="novoProduto()">
        Novo Produto
    </button>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="p : ${produtos}">
            <div class="card shadow-sm">

                <div class="card-body">
                    <h5 class="card-title" th:text="${p.nome}"></h5>
                    <p th:text="${p.descricao}"></p>

                    <p><strong>R$:</strong> <span th:text="${p.preco}"></span></p>
                    <p><strong>Estoque:</strong> <span th:text="${p.estoque}"></span></p>


                    <button class="btn btn-warning btn-sm btn-editar" data-bs-toggle="modal" data-bs-target="#productModal" th:attr="data-id=${p.id}, data-name=${p.nome}, data-description=${p.descricao}, data-price=${p.preco}, data-stock=${p.estoque}">
                        Editar
                    </button>

                    <a th:href="@{/produtos/delete/{id}(id=${p.id})}"
                       class="btn btn-danger btn-sm">
                        Deletar
                    </a>
                </div>

            </div>
        </div>
    </div>
    <div class="modal fade" id="productModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <form th:action="@{/produtos/save}" method="post">

                    <div class="modal-header">
                        <h5 class="modal-title">Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" name="id" id="id">

                        <div class="mb-3">
                            <label>Nome</label>
                            <input type="text" name="nome" id="name" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Descrição</label>
                            <input type="text" name="descricao" id="description" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Preço</label>
                            <input type="number" name="preco" id="price" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Estoque</label>
                            <input type="number" name="estoque" id="stock" class="form-control">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', function () {
            document.getElementById("id").value = this.dataset.id;
            document.getElementById("name").value = this.dataset.name;
            document.getElementById("description").value = this.dataset.description;
            document.getElementById("price").value = this.dataset.price;
            document.getElementById("stock").value = this.dataset.stock;
        });
    });

    function novoProduto() {
        document.getElementById("id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("description").value = "";
        document.getElementById("price").value = "";
        document.getElementById("stock").value = "";
    }

    function editarProduto(id, name, description, price, stock) {
        document.getElementById("id").value = id;
        document.getElementById("name").value = name;
        document.getElementById("description").value = description;
        document.getElementById("price").value = price;
        document.getElementById("stock").value = stock;
    }
</script>
</body>
</html>
