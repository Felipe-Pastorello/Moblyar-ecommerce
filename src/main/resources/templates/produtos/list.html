<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/body.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-3">Painel do Administrador</h2>
        <button class="btn btn-red mb-4" data-bs-toggle="modal" data-bs-target="#productModal" onclick="novoProduto()">
            <i class="bi bi-plus-circle me-2"></i>Novo Produto
        </button>
    </div>
    <div class="d-grid">
        <div class="col-12 mb-4" th:each="p : ${produtos}">
            <div class="card shadow-sm" th:style="${p.status == 'INATIVO'}? 'opacity:0.5': 'opacity:1'">
                <div class="card-body d-flex justify-content-around">
                    <div th:if="${!#lists.isEmpty(p.imagens)}">
                        <img th:src="@{'/uploads/' + ${p.imagens[0].nomeArquivo}}" width="100" height="100" class="rounded" style="object-fit:cover; max-height: 64px; max-width: 64px;">
                    </div>
                    <h5 class="card-title" th:text="${p.nome}"></h5>
                    <p th:text="${p.descricao}"></p>
                    <p><strong>R$:</strong> <span th:text="${p.preco}"></span></p>
                    <p><strong>Estoque:</strong> <span th:text="${p.estoque}"></span></p>
                    <button class="btn btn-light btn-editar" data-bs-toggle="modal" data-bs-target="#productModal" th:attr="data-id=${p.id}, data-name=${p.nome}, data-description=${p.descricao}, data-price=${p.preco}, data-stock=${p.estoque}">
                        <i class="bi bi-pen"></i>
                    </button>
                    <a th:href="@{/produtos/delete/{id}(id=${p.id})}"
                       class="btn btn-light">
                        <i class="bi bi-trash text-red"></i>
                    </a>
                    <a th:href="@{/produtos/status/{id}(id=${p.id})}"
                       th:classappend="${p.status == 'ATIVO'} ? 'btn-danger' : 'btn-success'" class="btn btn-sm">
                        <span th:text="${p.status == 'ATIVO'} ? 'Inativar' : 'Ativar'"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productModal" >
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/produtos/save}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input type="file" name="arquivos" multiple class="form-control">
                            <small class="text-muted">
                                Você pode selecionar várias imagens
                            </small>
                        </div>
                        <input type="hidden" name="id" id="id">
                        <div class="mb-3">
                            <label>Nome</label>
                            <input type="text" name="nome" id="name" class="form-control">
                        </div>
                        <label>Categorias</label>
                        <select name="categoriaIds" multiple class="form-select" size="5">
                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nome}"
                                    th:selected="${produto != null and produto.categorias.contains(c)}">
                            </option>
                        </select>
                        <small class="text-muted">
                            Segure CTRL (Windows) ou CMD (Mac) para selecionar várias categorias
                        </small>
                        <div class="mb-3">
                            <label>Descrição</label>
                            <input type="text" name="descricao" id="description" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Preço</label>
                            <input type="number" name="preco" id="price" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Estoque</label>
                            <input type="number" name="estoque" id="stock" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.btn-editar').forEach(btn => {
        btn.addEventListener('click', function () {
            document.getElementById("id").value = this.dataset.id;
            document.getElementById("name").value = this.dataset.name;
            document.getElementById("description").value = this.dataset.description;
            document.getElementById("price").value = this.dataset.price;
            document.getElementById("stock").value = this.dataset.stock;
        });
    });

    function novoProduto() {
        document.getElementById("id").value="";
        document.getElementById("name").value="";
        document.getElementById("description").value="";
        document.getElementById("price").value="";
        document.getElementById("stock").value="";

        document.querySelector(
            'input[name="arquivos"]'
        ).value="";
    }
</script>
</body>
</html>
