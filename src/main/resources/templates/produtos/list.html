<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/body.css}">
    <link rel="stylesheet" th:href="@{/css/GerenciarProdutos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body style="background-color: #F1F0F5">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-3">Painel do Administrador</h2>
        <button class="btn btn-red mb-4" data-bs-toggle="modal" data-bs-target="#productModal" onclick="novoProduto()">
            <i class="bi bi-plus-circle me-2"></i>Novo Produto
        </button>
    </div>
    <div class="mb-4">
        <a th:href="@{/categorias}" class="btn btn-light border border-2">Editar Categorias</a>
    </div>
    <div class="d-grid bg-white rounded rounded-4 p-4">
        <small class="mb-4 fw-semibold">
            Produtos
            (<span th:text="${#lists.size(produtos)}"></span>)
        </small>
        <div class="d-none d-lg-flex my-2">
            <p class="offset-1 col-lg-2 mb-0">Imagem</p>
            <p class="col-lg-2 mb-0">Nome</p>
            <p class="col-lg-2 mb-0">Preço</p>
            <p class="col-lg-2 mb-0">Estoque</p>
            <p class="col-lg-2 mb-0">Ação</p>
        </div>
        <div class="d-flex flex-wrap d-lg-grid">
            <div class="col-12 col-sm-6 col-lg-12 px-2 px-lg-0 mb-3 mb-lg-0" th:each="p : ${produtos}">
                <div class="card border-0 rounded-0 card-produtos" th:style="${p.status == 'INATIVO'}? 'opacity:0.5': 'opacity:1'">
                    <div class="card-body border-top border-bottom d-flex justify-content-around gap-2 gap-lg-0">
                        <div th:if="${!#lists.isEmpty(p.imagens)}" class="col-12 col-lg-2 offset-lg-1">
                            <img th:src="@{'/uploads/' + ${p.imagens[0].nomeArquivo}}" width="100" height="100" class="rounded" style="object-fit:cover; max-height: 64px; max-width: 64px;">
                        </div>
                        <h5 class="card-title col-12 col-lg-2 d-flex align-items-center mb-0" th:text="${p.nome}"></h5>
                        <!--<p th:text="${p.descricao}"></p>-->
                        <p class="col-12 col-lg-2 d-flex align-items-center mb-0"><strong>R$: </strong> <span th:text="${p.preco}"></span></p>
                        <p class="col-12 col-lg-2 d-flex align-items-center mb-0"><strong>Estoque: </strong> <span th:text="${p.estoque}"></span></p>
                        <div class="col-12 col-lg-3 d-flex align-items-center justify-content-around">
                            <button class="btn btn-light btn-editar" data-bs-toggle="modal" data-bs-target="#productModal" th:attr="data-id=${p.id}, data-name=${p.nome}, data-description=${p.descricao}, data-price=${p.preco}, data-stock=${p.estoque}">
                                <i class="bi bi-pen"></i>
                            </button>
                            <a th:href="@{/produtos/delete/{id}(id=${p.id})}" class="btn btn-light btn-excluir">
                                <i class="bi bi-trash text-red"></i>
                            </a>
                            <a th:href="@{/produtos/status/{id}(id=${p.id})}"
                               th:classappend="${p.status == 'ATIVO'} ? 'btn-danger' : 'btn-success'" class="btn btn-sm">
                                <span th:text="${p.status == 'ATIVO'} ? 'Inativar' : 'Ativar'"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="productModal" >
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formProduto" th:action="@{/produtos/save}" method="post" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Produto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input type="file" name="arquivos" id="arquivos" multiple class="form-control">
                            <div id="imagensExistentes"></div>
                            <small class="text-muted">
                                Você pode selecionar várias imagens
                                <br>
                            </small>
                            <small id="erroImagem" class="text-danger"></small>
                        </div>
                        <input type="hidden" name="id" id="id">
                        <div class="mb-3">
                            <label>Nome</label>
                            <input type="text" name="nome" id="name" class="form-control">
                            <small id="erroNome" class="text-danger"></small>
                        </div>
                        <label>Categorias</label>
                        <select name="categoriaIds" multiple class="form-select" size="5">
                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nome}"
                                    th:selected="${produto != null and produto.categorias.contains(c)}">
                            </option>
                        </select>
                        <small class="text-muted">
                            Segure CTRL (Windows) ou CMD (Mac) para selecionar várias categorias
                        </small>
                        <div class="mb-3">
                            <label>Descrição</label>
                            <input type="text" name="descricao" id="description" class="form-control">
                            <small id="erroDescricao" class="text-danger"></small>
                        </div>
                        <div class="mb-3">
                            <label>Preço</label>
                            <input type="number" name="preco" id="price" class="form-control">
                            <small id="erroPreco" class="text-danger"></small>
                        </div>
                        <div class="mb-3">
                            <label>Estoque</label>
                            <input type="number" name="estoque" id="stock" class="form-control">
                            <small id="erroEstoque" class="text-danger"></small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="btnSalvar" class="btn btn-success">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.querySelectorAll('.btn-editar').forEach(btn => {

        btn.addEventListener('click', async function () {

            const produtoId = this.dataset.id;

            document.getElementById("id").value = produtoId;
            document.getElementById("name").value = this.dataset.name;
            document.getElementById("description").value = this.dataset.description;
            document.getElementById("price").value = this.dataset.price;
            document.getElementById("stock").value = this.dataset.stock;

            const container =
                document.getElementById(
                    "imagensExistentes"
                );

            container.innerHTML = "";

            const response =
                await fetch(
                    `/produtos/${produtoId}/imagens`
                );

            const imagens =
                await response.json();

            imagens.forEach(img => {

                container.innerHTML += `
<div
    class="d-flex align-items-center gap-2 mb-2"
    data-imagem-id="${img.id}">

    <img
        src="/uploads/${img.nomeArquivo}"
        width="80"
        height="80"
        class="rounded"
        style="object-fit:cover">

    <button
        type="button"
        class="btn btn-danger btn-sm"
        onclick="excluirImagem(${img.id})">

        <i class="bi bi-trash"></i>

    </button>

</div>
`;
            });
        });
    });

    async function excluirImagem(id){

        const result = await Swal.fire({
            title: "Excluir imagem?",
            text: "Essa ação não poderá ser desfeita.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Excluir",
            cancelButtonText: "Cancelar"
        });

        if(!result.isConfirmed){
            return;
        }

        try {

            const response = await fetch(
                `/produtos/imagem/delete/${id}`
            );

            if(response.ok){

                document
                    .querySelector(
                        `[data-imagem-id="${id}"]`
                    )
                    ?.remove();

                Swal.fire({
                    title: "Imagem excluída!",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });

            } else {

                Swal.fire(
                    "Erro",
                    "Não foi possível excluir a imagem.",
                    "error"
                );
            }

        } catch(e){

            console.error(e);

            Swal.fire(
                "Erro",
                "Não foi possível excluir a imagem.",
                "error"
            );
        }
    }

    function novoProduto() {
        document.getElementById("imagensExistentes").innerHTML = "";
        document.getElementById("id").value="";
        document.getElementById("name").value="";
        document.getElementById("description").value="";
        document.getElementById("price").value="";
        document.getElementById("stock").value="";

        document.querySelector(
            'input[name="arquivos"]'
        ).value="";

        document.querySelectorAll(".text-danger")
            .forEach(el => el.textContent = "");

        btnSalvar.disabled = false;
        nomeValido = true;
    }

    function validarFormulario() {

        let valido = true;

        const nome = document.getElementById("name");
        const descricao = document.getElementById("description");
        const preco = document.getElementById("price");
        const estoque = document.getElementById("stock");
        const arquivos = document.getElementById("arquivos");
        const editando = document.getElementById("id").value !== "";

        document.getElementById("erroDescricao").textContent = "";
        document.getElementById("erroPreco").textContent = "";
        document.getElementById("erroEstoque").textContent = "";
        document.getElementById("erroImagem").textContent = "";

        if(nome.value.trim() === ""){
            document.getElementById("erroNome").textContent =
                "O nome é obrigatório.";
            valido = false;
        }

        if(descricao.value.trim() === ""){
            document.getElementById("erroDescricao").textContent =
                "A descrição é obrigatória.";
            valido = false;
        }

        if(preco.value === "" || parseFloat(preco.value) <= 0){
            document.getElementById("erroPreco").textContent =
                "O preço deve ser maior que zero.";
            valido = false;
        }

        if(estoque.value === "" || parseInt(estoque.value) <= 0){
            document.getElementById("erroEstoque").textContent =
                "O estoque deve ser maior que zero.";
            valido = false;
        }

        const imagensExistentes = document.querySelectorAll("#imagensExistentes [data-imagem-id]");
        if(
            arquivos.files.length === 0
            &&
            imagensExistentes.length === 0
        ){
            document.getElementById("erroImagem").textContent =
                "O produto deve possuir ao menos uma imagem.";

            valido = false;
        }

        return valido;
    }

    const nomeInput = document.getElementById("name");
    const erroNome = document.getElementById("erroNome");
    const btnSalvar = document.getElementById("btnSalvar");

    let nomeValido = true;

    nomeInput.addEventListener("input", async () => {

        const response = await fetch(
            `/produtos/existe?nome=${encodeURIComponent(nomeInput.value)}`
        );

        const existe = await response.json();

        if(existe){

            erroNome.textContent =
                "Já existe um produto com esse nome.";

            btnSalvar.disabled = true;

            nomeValido = false;

        }else{

            erroNome.textContent = "";

            btnSalvar.disabled = false;

            nomeValido = true;
        }
    });

    document.getElementById("formProduto").addEventListener("submit", function(e){

            if(!validarFormulario() || !nomeValido){
                e.preventDefault();
            }

        });

    document.querySelectorAll(".btn-excluir")
        .forEach(btn => {

            btn.addEventListener("click", function(e){

                e.preventDefault();

                const url = this.href;

                Swal.fire({
                    title: "Tem certeza?",
                    text: "O produto será excluído permanentemente.",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonText: "Sim, excluir",
                    cancelButtonText: "Cancelar"
                }).then((result) => {

                    if(result.isConfirmed){
                        window.location.href = url;
                    }
                });
            });
        });

    const params = new URLSearchParams(window.location.search);

    if(params.get("sucesso") === "cadastrado"){

        Swal.fire({
            title: "Produto cadastrado!",
            text: "O produto foi criado com sucesso.",
            icon: "success"
        });

    }

    if(params.get("sucesso") === "editado"){

        Swal.fire({
            title: "Produto atualizado!",
            text: "As alterações foram salvas.",
            icon: "success"
        });

    }
</script>
</body>
</html>
