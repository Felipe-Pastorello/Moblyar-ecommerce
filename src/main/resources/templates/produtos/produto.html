<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${produto.nome} + ' - Moblyar'">
        Produto - Moblyar
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/produto.css}">
</head>

<body>
<div th:replace="~{includes/header :: header}"></div>
<main class="produto-page">
    <div class="container py-5">
        <!-- Voltar -->
        <div class="mb-4">
            <a th:href="@{/}" class="text-decoration-none text-dark">
                <i class="bi bi-arrow-left me-2"></i>Voltar
            </a>
        </div>
        <div class="row g-4 g-lg-5">
            <div class="col-lg-6">
                <div class="produto-imagem-container">
                    <img th:if="${!#lists.isEmpty(produto.imagens)}" th:src="@{'/uploads/' + ${produto.imagens[0].nomeArquivo}}" th:alt="${produto.nome}" class="produto-imagem">
                    <div th:if="${#lists.isEmpty(produto.imagens)}" class="produto-sem-imagem">
                        <i class="bi bi-image"></i>
                        <span>Imagem indisponível</span>
                    </div>
                </div>
                <!-- Miniaturas -->
                <div th:if="${#lists.size(produto.imagens) > 1}" class="produto-miniaturas mt-3">
                    <div th:each="imagem : ${produto.imagens}" class="produto-miniatura">
                        <img th:src="@{'/uploads/' + ${imagem.nomeArquivo}}" th:alt="${produto.nome}">
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="produto-informacoes">
                    <!-- Nome -->
                    <h1 class="produto-titulo" th:text="${produto.nome}">
                        Sofá Cinza Moderno
                    </h1>
                    <!-- Preço -->
                    <div class="produto-preco mb-4">
                        R$
                        <span th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}">
                            899.99
                        </span>
                    </div>
                    <!-- Descrição -->
                    <p class="produto-descricao" th:text="${produto.descricao}">
                        Sofá contemporâneo de 3 lugares com almofadas macias
                        e design elegante.
                    </p>
                    <!-- Categorias -->
                    <div class="produto-categorias mb-4">
                        <strong>Categoria:</strong>
                        <span th:each="categoria, iter : ${produto.categorias}">
                            <span th:text="${categoria.nome}">
                                Sala de estar
                            </span>
                            <span th:if="${!iter.last}">, </span>
                        </span>
                    </div>
                    <hr>
                    <!-- Estoque -->
                    <div class="mb-3">
                        <strong>Quantidade</strong>
                    </div>
                    <!-- Quantidade -->
                    <div class="quantidade-container mb-3">
                        <button type="button" class="btn btn-light border" id="btnDiminuir">
                            <i class="bi bi-dash"></i>
                        </button>
                        <span id="quantidade" class="quantidade">
                            1
                        </span>
                        <button type="button" class="btn btn-light border" id="btnAumentar">
                            <i class="bi bi-plus"></i>
                        </button>
                    </div>
                    <div class="d-grid gap-2">
                        <!-- Adicionar -->
                        <form id="formAdicionarCarrinho"
                              th:action="@{/carrinho/adicionar}"
                              method="post">

                            <input
                                    type="hidden"
                                    name="produtoId"
                                    th:value="${produto.id}">

                            <input
                                    type="hidden"
                                    name="quantidade"
                                    id="quantidadeInput"
                                    value="1">

                            <input
                                    type="hidden"
                                    th:name="${_csrf.parameterName}"
                                    th:value="${_csrf.token}">

                            <button
                                    type="submit"
                                    class="btn btn-red w-100">

                                <i class="bi bi-cart3 me-2"></i>
                                Adicionar ao carrinho

                            </button>

                        </form>
                        <!-- Comprar -->
                        <button type="button" class="btn btn-light border">
                            Comprar agora
                        </button>
                        <div id="frete-container"></div>

                        <script src="https://cepcerto.com/widget_frete/" data-public-key="pk_live_c48679a4e3e2026aa4e6aa1980cae21eb22c5f1601f6223f">
                        </script>
                        <script>
                            document.addEventListener("DOMContentLoaded", () => {
                                const observer = new MutationObserver(() => {
                                    const frete = document.querySelector(".cepcerto-frete");
                                    const container = document.querySelector("#frete-container");

                                    if (frete && container) {
                                        container.appendChild(frete);
                                        observer.disconnect();
                                    }
                                });

                                observer.observe(document.body, {
                                    childList: true,
                                    subtree: true
                                });
                            });
                        </script>
                    </div>

                    <!--<div>
                        <h5 class="fw-bold mb-3">
                            Por que comprar de nós?
                        </h5>
                        <ul class="lista-beneficios">
                            <li>
                                <i class="bi bi-check2"></i>
                                Entregas grátis acima de R$2500
                            </li>
                            <li>
                                <i class="bi bi-check2"></i>
                                Política de retorno de 30 dias
                            </li>
                            <li>
                                <i class="bi bi-check2"></i>
                                Qualidade garantida
                            </li>
                            <li>
                                <i class="bi bi-check2"></i>
                                Pagamento seguro
                            </li>
                        </ul>
                    </div>-->
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{includes/footer :: footer}"></div>
<div th:replace="~{includes/carrinho :: carrinho}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/produto.js}"></script>
<script th:src="@{/js/carrinho.js}"></script>

</body>

</html>
