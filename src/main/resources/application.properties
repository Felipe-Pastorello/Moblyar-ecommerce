spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

admin.username=admin
admin.password=1234

asaas.api-url=https://api-sandbox.asaas.com/v3
asaas.api-key=${ASAAS_API_KEY}
asaas.callback.success-url=https://shine-landlady-nutty.ngrok-free.dev/checkout/retorno/sucesso
asaas.callback.cancel-url=https://shine-landlady-nutty.ngrok-free.dev/checkout/retorno/cancelado
asaas.callback.expired-url=https://shine-landlady-nutty.ngrok-free.dev/checkout/retorno/expirado

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/
